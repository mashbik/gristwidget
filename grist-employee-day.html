<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Мой день · Onda</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{--gray:#424242;--grayUp:#4d4d4d;--grayHi:#5e5e5e;--black:#0A0A0A;
    --orange:#FF4D00;--lime:#B8FF00;--cream:#F0EDE6;--line:#5e5e5e;--muted:#a8a39a;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--gray);color:var(--cream);
    font-family:'Onest',system-ui,sans-serif;font-size:15px}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 40px;display:flex;flex-direction:column;gap:18px}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  h1{font-size:20px;margin:0;letter-spacing:.3px;font-weight:800}
  .who{font-size:13px;color:var(--muted)}
  .who b{color:var(--cream)}
  .card{background:var(--grayUp);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
  label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;display:block;margin-bottom:7px}
  select,input[type=text]{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--gray);color:var(--cream);font-size:15px;font-family:inherit}
  select:focus,input:focus{outline:2px solid var(--orange)}
  select:disabled{opacity:.45}
  .days{display:flex;gap:8px}
  .day{flex:1;padding:12px 0;border-radius:11px;border:1px solid var(--line);background:var(--gray);
    text-align:center;cursor:pointer;font-weight:700;transition:.12s}
  .day.sel{background:var(--lime);color:var(--black);border-color:var(--lime)}
  .dates{display:flex;gap:8px}
  .dt{flex:1;padding:11px 0;border-radius:11px;border:1px solid var(--line);background:var(--gray);
    text-align:center;cursor:pointer;font-weight:600;font-size:14px}
  .dt.sel{background:var(--cream);color:var(--black);border-color:var(--cream)}
  button{cursor:pointer;font-family:inherit;border:none}
  .save{padding:15px;border-radius:100px;background:var(--orange);color:#fff;font-weight:800;font-size:16px;transition:.15s}
  .save:hover{filter:brightness(1.08)}
  .save:disabled{opacity:.4;cursor:default}
  .msg{font-size:13px;padding:11px 13px;border-radius:11px;display:none;white-space:pre-wrap}
  .msg.ok{display:block;background:var(--lime);color:var(--black);font-weight:700}
  .msg.err{display:block;background:var(--orange);color:#fff}
  .recent{display:flex;flex-direction:column;gap:8px}
  .recent h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:8px 0 0}
  .rec{background:var(--grayUp);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;gap:10px}
  .rec .d{color:var(--muted);white-space:nowrap}
  .empty{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Мой день</h1>
    <div class="who" id="who">…</div>
  </div>

  <div class="card">
    <div>
      <label>Проект</label>
      <select id="project"><option value="">—</option></select>
    </div>
    <div>
      <label>Задача (по твоей роли)</label>
      <select id="task" disabled><option value="">сначала выбери проект</option></select>
    </div>
    <div>
      <label>Сколько времени</label>
      <div class="days" id="days">
        <div class="day" data-v="0.25">¼</div>
        <div class="day" data-v="0.5">½</div>
        <div class="day" data-v="0.75">¾</div>
        <div class="day sel" data-v="1">1 день</div>
      </div>
    </div>
    <div>
      <label>Когда</label>
      <div class="dates" id="dates">
        <div class="dt sel" data-d="today">Сегодня</div>
        <div class="dt" data-d="yesterday">Вчера</div>
      </div>
    </div>
    <div>
      <label>Что делал (необязательно)</label>
      <input type="text" id="note" placeholder="кратко…" />
    </div>
    <button class="save" id="save" disabled>Записать день →</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="recent">
    <h2>Мои последние записи</h2>
    <div id="recentList"><div class="empty">загрузка…</div></div>
  </div>
</div>

<script>
const $=(id)=>document.getElementById(id);
const norm=(s)=>(s||"").toString().toLowerCase().replace(/[\s_().,:#-]/g,"");
const toRecords=(t)=>{const ids=t.id||[];return ids.map((id,i)=>{const r={id};for(const k in t){if(k!=="id")r[k]=t[k][i];}return r;});};
const refId=(v)=>Array.isArray(v)?v[1]:v;
const refListVals=(v)=>{if(Array.isArray(v)){return v[0]==='L'?v.slice(1):v.filter(x=>typeof x==='number');}return v!=null?[v]:[];};

let SCHEMA={tables:{},cols:{}};
async function buildSchema(){
  const T=toRecords(await grist.docApi.fetchTable("_grist_Tables"));
  const C=toRecords(await grist.docApi.fetchTable("_grist_Tables_column"));
  const num2id={}; T.forEach(t=>num2id[t.id]=t.tableId);
  SCHEMA={tables:{},cols:{}};
  T.forEach(t=>SCHEMA.tables[t.tableId]=t.tableId);
  C.forEach(c=>{
    const tid=num2id[c.parentId]; if(!tid)return;
    if(!SCHEMA.cols[tid])SCHEMA.cols[tid]={};
    let ref=null;
    if(typeof c.type==="string"&&c.type.startsWith("Ref:"))ref=c.type.slice(4);
    if(typeof c.type==="string"&&c.type.startsWith("RefList:"))ref=c.type.slice(8);
    SCHEMA.cols[tid][norm(c.label||c.colId)]={colId:c.colId,type:c.type,ref};
  });
}
const hasCol=(tid,names)=>names.some(n=>SCHEMA.cols[tid]&&SCHEMA.cols[tid][norm(n)]);
const colOf=(tid,names)=>{for(const n of names){const c=SCHEMA.cols[tid]&&SCHEMA.cols[tid][norm(n)];if(c)return c;}return null;};

const T={}; // resolved table ids
const C={}; // resolved columns
let ME=null, MYROLE=null;
let DATA={projects:[],sostav:[],zan:[]};
let sel={days:1,date:"today"};

function findTables(){
  for(const tid in SCHEMA.cols){
    const projname=hasCol(tid,["Название проекта"]); const client=hasCol(tid,["Клиент"]);
    const naimen=hasCol(tid,["Наименование проекта"]); const podetap=hasCol(tid,["Подэтап"]);
    const tip=hasCol(tid,["Тип проекта"]); const rolc=hasCol(tid,["Роль"]);
    const email=hasCol(tid,["E-mail","Email","E mail"]); const stavka=hasCol(tid,["Ставка/день","Ставка_день","Ставка"]);
    const sostavRef=hasCol(tid,["Состав"]); const fakt=hasCol(tid,["Факт_дней","Факт дней"]);
    if(projname&&client&&!T.proj)T.proj=tid;                        // Список проектов
    else if(naimen&&podetap&&rolc&&!tip&&!T.sostav)T.sostav=tid;    // Состав проектов (факт)
    if(email&&rolc&&!T.emp)T.emp=tid;                               // Сотрудники
    if(sostavRef&&fakt&&!T.zan)T.zan=tid;                           // Занятость (факт)
  }
}

async function whoAmI(){
  // личность вошедшего
  let email=null;
  try{ const o=await grist.getOption?.(); }catch(_){}
  try{
    const tok=await grist.docApi.getAccessToken?.({readOnly:true});
  }catch(_){}
  // надёжный способ — grist.user (если доступен через ready options)
  return email;
}

async function load(){
  try{
    await buildSchema(); findTables();
    if(!T.emp||!T.sostav||!T.proj||!T.zan){
      msg("Не нашёл таблицы. Сотрудники:"+T.emp+" Состав:"+T.sostav+" Проекты:"+T.proj+" Занятость:"+T.zan,"err");return;
    }
    // колонки
    C.empEmail=colOf(T.emp,["E-mail","Email","E mail"]);
    C.empRole =colOf(T.emp,["Роль"]);
    C.sProj=colOf(T.sostav,["Наименование проекта"]);
    C.sEtap=colOf(T.sostav,["Этап"]);
    C.sSub =colOf(T.sostav,["Подэтап"]);
    C.sRole=colOf(T.sostav,["Роль"]);
    C.zSost=colOf(T.zan,["Состав"]);
    C.zEmp =colOf(T.zan,["Сотрудник"]);
    C.zProj=colOf(T.zan,["Проект"]);
    C.zDate=colOf(T.zan,["Дата заполнения","Дата"]);
    C.zFakt=colOf(T.zan,["Факт_дней","Факт дней"]);
    C.zNote=colOf(T.zan,["Что делал"]);

    DATA.projects=toRecords(await grist.docApi.fetchTable(T.proj));
    DATA.sostav  =toRecords(await grist.docApi.fetchTable(T.sostav));
    DATA.emp     =toRecords(await grist.docApi.fetchTable(T.emp));
    DATA.zan     =toRecords(await grist.docApi.fetchTable(T.zan));

    // кто я: email берём из grist user
    const email=(window.__gristUserEmail||"").toLowerCase();
    ME=DATA.emp.find(e=>String(e[C.empEmail.colId]||"").toLowerCase()===email) || null;
    if(!ME){
      $("who").innerHTML="не опознан";
      msg("Не нашёл тебя в «Сотрудниках» по email "+(email||"(пусто)")+".\nПопроси владельца добавить твой email.","err");
      return;
    }
    MYROLE=refId(ME[C.empRole.colId]);
    const nameCol=Object.values(SCHEMA.cols[T.emp]).find(c=>/имя|name|фио/.test(c.colId.toLowerCase()));
    const myName= nameCol? ME[nameCol.colId] : email;
    $("who").innerHTML="<b>"+(myName||email)+"</b>";

    fillProjects(); renderRecent(); clrMsg();
  }catch(e){ msg("Ошибка: "+e.message,"err"); }
}

// проекты, где у моей роли есть задачи
function myProjectIds(){
  const ids=new Set();
  DATA.sostav.forEach(r=>{
    const roles=refListVals(r[C.sRole.colId]);
    if(roles.includes(MYROLE)) ids.add(refId(r[C.sProj.colId]));
  });
  return ids;
}
function projName(p){
  const nc=Object.values(SCHEMA.cols[T.proj]).find(c=>/название проекта|название|name/.test((c.colId||"").toLowerCase()));
  return nc? p[nc.colId] : ("Проект #"+p.id);
}
function fillProjects(){
  const allow=myProjectIds();
  const list=DATA.projects.filter(p=>allow.has(p.id));
  $("project").innerHTML='<option value="">—</option>'+
    list.map(p=>`<option value="${p.id}">${projName(p)}</option>`).join("");
}

// задачи (строки состава) выбранного проекта по моей роли
function fillTasks(){
  const pid=Number($("project").value);
  const task=$("task");
  if(!pid){ task.innerHTML='<option value="">сначала выбери проект</option>'; task.disabled=true; check(); return; }
  const rows=DATA.sostav.filter(r=>{
    const roles=refListVals(r[C.sRole.colId]);
    return refId(r[C.sProj.colId])===pid && roles.includes(MYROLE);
  });
  if(!rows.length){ task.innerHTML='<option value="">нет задач по твоей роли</option>'; task.disabled=true; check(); return; }
  task.disabled=false;
  task.innerHTML='<option value="">—</option>'+rows.map(r=>{
    const e=labelRef(C.sEtap,r); const s=labelRef(C.sSub,r);
    return `<option value="${r.id}">${e}${s?(" · "+s):""}</option>`;
  }).join("");
  check();
}
// показать название этапа/подэтапа из связанной "Шаблон Этапы"
let ETAPY=null;
function labelRef(col,row){
  const id=refId(row[col.colId]); if(id==null)return "";
  if(!ETAPY){ return "#"+id; }
  const rec=ETAPY[id]; return rec||("#"+id);
}

function todayISO(off){ const d=new Date(); d.setDate(d.getDate()-(off||0));
  return d.toISOString().slice(0,10); }

function renderRecent(){
  const box=$("recentList");
  const mine=DATA.zan.filter(z=>refId(z[C.zEmp.colId])===ME.id)
    .sort((a,b)=> String(b[C.zDate.colId]).localeCompare(String(a[C.zDate.colId]))).slice(0,6);
  if(!mine.length){ box.innerHTML='<div class="empty">пока нет записей</div>'; return; }
  box.innerHTML=mine.map(z=>{
    const d=z[C.zDate.colId]||""; const f=z[C.zFakt.colId]??""; const n=z[C.zNote.colId]||"";
    return `<div class="rec"><span>${n||"запись"} · ${f} дн.</span><span class="d">${fmtDate(d)}</span></div>`;
  }).join("");
}
function fmtDate(v){
  // Grist даты могут быть числом (дни от эпохи) или строкой
  if(typeof v==="number"){ const d=new Date(v*1000); return d.toISOString().slice(0,10); }
  return String(v).slice(0,10);
}

function check(){
  $("save").disabled = !($("project").value && $("task").value);
}
function msg(t,k){ const m=$("msg"); m.className="msg "+k; m.textContent=t; }
function clrMsg(){ const m=$("msg"); m.className="msg"; m.textContent=""; }

async function save(){
  clrMsg();
  const sostavId=Number($("task").value);
  if(!ME||!sostavId)return;
  $("save").disabled=true;
  try{
    const pid=Number($("project").value);
    const dateStr = sel.date==="today"? todayISO(0): todayISO(1);
    const fields={};
    fields[C.zSost.colId]=sostavId;
    fields[C.zEmp.colId]=ME.id;
    if(C.zProj) fields[C.zProj.colId]=pid;
    if(C.zDate) fields[C.zDate.colId]=dateStr;
    if(C.zFakt) fields[C.zFakt.colId]=sel.days;
    if(C.zNote) fields[C.zNote.colId]=$("note").value||"";
    await grist.docApi.applyUserActions([["AddRecord",T.zan,null,fields]]);
    msg("Записано: "+sel.days+" дн. ("+(sel.date==="today"?"сегодня":"вчера")+").","ok");
    $("note").value="";
    DATA.zan=toRecords(await grist.docApi.fetchTable(T.zan));
    renderRecent();
  }catch(e){ msg("Не удалось записать: "+e.message,"err"); }
  finally{ $("save").disabled=false; check(); }
}

// UI события
$("project").addEventListener("change",fillTasks);
$("task").addEventListener("change",check);
$("days").addEventListener("click",e=>{const d=e.target.closest(".day");if(!d)return;
  [...$("days").children].forEach(x=>x.classList.remove("sel"));d.classList.add("sel");sel.days=Number(d.dataset.v);});
$("dates").addEventListener("click",e=>{const d=e.target.closest(".dt");if(!d)return;
  [...$("dates").children].forEach(x=>x.classList.remove("sel"));d.classList.add("sel");sel.date=d.dataset.d;});
$("save").addEventListener("click",save);

// получаем email вошедшего через Grist и грузим названия этапов
grist.ready({requiredAccess:"full"});
grist.onOptions(()=>{});
// Grist отдаёт пользователя через grist.user в некоторых версиях; подстрахуемся:
(async ()=>{
  try{
    const prof = await grist.docApi.getAccessToken?.({readOnly:true});
  }catch(_){}
  try{
    // основной способ: grist.user доступен после ready
    if(grist.user && grist.user.email){ window.__gristUserEmail=grist.user.email; }
  }catch(_){}
  // загрузим справочник этапов для подписей (Шаблон Этапы)
  try{
    await buildSchema();
    let etapyTid=null;
    for(const tid in SCHEMA.cols){
      if(hasCol(tid,["Этапы"])&&hasCol(tid,["Подэтап"])&&hasCol(tid,["Роль"])&&!hasCol(tid,["Наименование проекта"])){ etapyTid=tid; break; }
    }
    if(etapyTid){
      const rows=toRecords(await grist.docApi.fetchTable(etapyTid));
      const sub=colOf(etapyTid,["Подэтап"]); const et=colOf(etapyTid,["Этапы"]);
      ETAPY={}; rows.forEach(r=>{ ETAPY[r.id]= (r[sub&&sub.colId]||r[et&&et.colId]||("#"+r.id)); });
    }
  }catch(_){}
  load();
})();
</script>
</body>
</html>
