<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Кто я · диагностика</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  body{margin:0;background:#424242;color:#F0EDE6;font-family:system-ui,sans-serif;font-size:14px;padding:18px}
  h1{font-size:16px;margin:0 0 12px}
  .row{background:#4d4d4d;border:1px solid #5e5e5e;border-radius:10px;padding:10px 12px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
  .k{color:#B8FF00;font-weight:700}
  .ok{color:#B8FF00} .no{color:#FF4D00}
</style>
</head>
<body>
<h1>Диагностика: как Grist отдаёт пользователя</h1>
<div id="out">Проверяю…</div>
<script>
const out=document.getElementById("out");
const lines=[];
function add(k,v,ok){ lines.push(`<div class="row"><span class="k">${k}</span>\n<span class="${ok?'ok':'no'}">${v}</span></div>`); out.innerHTML=lines.join(""); }

grist.ready({requiredAccess:"full"});

(async ()=>{
  // 1. grist.user (если есть)
  try{ add("grist.user", JSON.stringify(grist.user||null), !!(grist.user&&grist.user.email)); }
  catch(e){ add("grist.user","ошибка: "+e.message,false); }

  // 2. grist.widgetApi / grist.getOption нет смысла — пропускаем

  // 3. через ready options callback — иногда email приходит в onOptions
  try{
    const opts = await grist.widgetApi?.getOptions?.();
    add("widgetApi.getOptions", JSON.stringify(opts||null), false);
  }catch(e){ add("widgetApi.getOptions","нет",false); }

  // 4. access token + /api/session/access/active
  try{
    const tok=await grist.docApi.getAccessToken({readOnly:true});
    add("getAccessToken", JSON.stringify({baseUrl:tok&&tok.baseUrl})||"нет", !!(tok&&tok.baseUrl));
    if(tok&&tok.baseUrl){
      // вычислим корень сервера
      const root = tok.baseUrl.replace(/\/api\/docs\/.*$/,"");
      // попробуем несколько эндпоинтов
      const tries=[
        root+"/api/session/access/active",
        root+"/o/docs/api/session/access/active",
      ];
      for(const u of tries){
        try{
          const r=await fetch(u+(u.includes("?")?"&":"?")+"auth="+tok.token);
          const txt=await r.text();
          add("GET "+u, "status "+r.status+" · "+txt.slice(0,300), r.ok);
        }catch(e){ add("GET "+u,"ошибка: "+e.message,false); }
      }
    }
  }catch(e){ add("getAccessToken","ошибка: "+e.message,false); }

  // 5. docApi.getDocName / прочее как контекст
  try{ const dn=await grist.docApi.getDocName?.(); add("getDocName", String(dn), true); }catch(e){}
})();
</script>
</body>
</html>
